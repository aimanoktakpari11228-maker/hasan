<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#7c3aed">

<title>حسن ♥ نادی</title>

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{
 box-sizing:border-box;
 margin:0;
 padding:0;
 font-family:Vazirmatn,sans-serif
}

:root{
 --p:#7c3aed;
 --p2:#a78bfa;
 --bg:#f5f3ff;
 --card:#fff;
 --text:#32135f;
 --muted:#8b7aa8;
 --border:#e9d5ff;
}

body{
 min-height:100vh;
 background:
 radial-gradient(circle at 20% 20%,#c4b5fd55,transparent 30%),
 radial-gradient(circle at 80% 80%,#f0abfc55,transparent 30%),
 linear-gradient(135deg,#5b21b6,#a78bfa,#ddd6fe);
 display:flex;
 align-items:center;
 justify-content:center;
 padding:12px;
 color:var(--text);
 overflow:hidden;
}

.app{
 width:100%;
 max-width:440px;
 height:92vh;
 max-height:820px;
 background:var(--bg);
 border-radius:28px;
 overflow:hidden;
 box-shadow:0 25px 70px #4c1d9570;
 position:relative;
}

.screen{
 height:100%;
 display:flex;
 flex-direction:column;
}

/* LOGIN */

#login{
 justify-content:center;
 align-items:center;
 padding:30px;
 text-align:center;
 background:
 radial-gradient(circle at 20% 10%,#ede9fe,transparent 35%),
 radial-gradient(circle at 90% 90%,#ddd6fe,transparent 30%),
 #faf5ff;
 position:relative;
 overflow:hidden;
}

.heart{
 font-size:64px;
 animation:pulse 1.5s infinite;
}

@keyframes pulse{
 50%{transform:scale(1.14)}
}

.login-title{
 font-size:29px;
 font-weight:800;
 color:#5b21b6;
 margin:10px 0 5px;
}

.login-sub{
 color:#8b5cf6;
 margin-bottom:25px;
}

.password{
 width:100%;
 padding:14px;
 border:2px solid #ddd6fe;
 border-radius:17px;
 outline:none;
 margin:8px 0 12px;
 text-align:center;
 background:#fff;
}

.user{
 width:100%;
 padding:14px;
 margin:6px 0;
 border:0;
 border-radius:18px;
 font-size:15px;
 font-weight:700;
 cursor:pointer;
 transition:.2s;
}

.user:active{
 transform:scale(.97);
}

.hasan{
 background:linear-gradient(90deg,#6d28d9,#8b5cf6);
 color:#fff;
 box-shadow:0 8px 20px #7c3aed30;
}

.nadi{
 background:#ede9fe;
 color:#6b21a8;
}

/* HEADER */

.header{
 padding:14px 16px;
 color:#fff;
 background:linear-gradient(110deg,#6d28d9,#a78bfa);
 position:relative;
 box-shadow:0 5px 20px #4c1d9530;
}

.headrow{
 display:flex;
 align-items:center;
 gap:11px;
}

.avatar{
 width:46px;
 height:46px;
 border-radius:50%;
 background:#ffffff25;
 font-size:22px;
 display:flex;
 align-items:center;
 justify-content:center;
 border:2px solid #ffffff80;
}

.header h2{
 font-size:18px;
}

.status{
 font-size:11px;
 opacity:.9;
 margin-top:2px;
}

.status.online{
 color:#dcfce7;
}

.iconbtn{
 margin-right:auto;
 background:#ffffff22;
 color:#fff;
 border:0;
 width:40px;
 height:40px;
 border-radius:50%;
 cursor:pointer;
 font-size:18px;
}

/* MENU */

.menu{
 position:absolute;
 left:12px;
 top:65px;
 background:#fff;
 border-radius:17px;
 padding:7px;
 box-shadow:0 12px 35px #0003;
 display:none;
 z-index:50;
}

.menu button{
 display:block;
 border:0;
 background:none;
 padding:11px 14px;
 width:165px;
 text-align:right;
 color:#4c1d95;
 border-radius:10px;
 cursor:pointer;
}

/* SEARCH */

.searchbar{
 display:none;
 background:#fff;
 padding:8px;
 border-bottom:1px solid #ede9fe;
}

.searchbar input{
 width:100%;
 border:2px solid #ddd6fe;
 border-radius:20px;
 padding:9px 13px;
 outline:none;
}

/* MESSAGES */

.messages{
 flex:1;
 overflow-y:auto;
 padding:18px 14px 25px;
 display:flex;
 flex-direction:column;
 gap:11px;
 background:
 radial-gradient(circle at 10% 20%,#ddd6fe30,transparent 25%),
 linear-gradient(#f8f7ff,#f3efff);
}

.msg{
 max-width:84%;
 padding:11px 14px;
 border-radius:19px;
 box-shadow:0 3px 12px #4c1d9512;
 position:relative;
 word-break:break-word;
 animation:messageIn .2s ease;
}

@keyframes messageIn{
 from{
  opacity:0;
  transform:translateY(7px) scale(.98);
 }
 to{
  opacity:1;
  transform:none;
 }
}

.me{
 align-self:flex-start;
 background:linear-gradient(135deg,#7c3aed,#8b5cf6);
 color:#fff;
 border-bottom-right-radius:5px;
}

.other{
 align-self:flex-end;
 background:#fff;
 color:#43206d;
 border:1px solid #e9d5ff;
 border-bottom-left-radius:5px;
}

.msgname{
 font-size:11px;
 font-weight:700;
 margin-bottom:4px;
 opacity:.8;
}

.body{
 line-height:1.8;
 white-space:pre-wrap;
}

.msgtime{
 font-size:9px;
 opacity:.65;
 margin-top:5px;
 text-align:left;
}

.edited{
 font-size:9px;
 opacity:.55;
 margin-right:4px;
}

.replybox{
 border-right:3px solid #c4b5fd;
 background:#ffffff20;
 padding:5px 8px;
 margin-bottom:7px;
 font-size:10px;
 border-radius:7px;
}

.other .replybox{
 background:#f5f3ff;
}

.reaction{
 position:absolute;
 bottom:-11px;
 left:8px;
 background:#fff;
 color:#32135f;
 border-radius:14px;
 padding:3px 7px;
 font-size:13px;
 box-shadow:0 2px 8px #0002;
}

.pinned{
 position:absolute;
 top:-9px;
 right:8px;
 background:#fbbf24;
 color:#fff;
 width:22px;
 height:22px;
 border-radius:50%;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:11px;
}

/* TYPING */

.typing{
 height:22px;
 padding:0 18px;
 color:#8b5cf6;
 font-size:11px;
 background:#f3efff;
}

/* INPUT */

.replyPreview{
 display:none;
 background:#fff;
 border-top:1px solid #ede9fe;
 padding:8px 12px;
}

.replyPreviewBox{
 border-right:3px solid #8b5cf6;
 padding-right:8px;
 font-size:11px;
 color:#6d28d9;
}

.replyPreview button{
 float:left;
 border:0;
 background:none;
 font-size:16px;
 color:#8b5cf6;
}

.inputbar{
 background:#fff;
 padding:9px;
 display:flex;
 gap:7px;
 border-top:1px solid #ede9fe;
}

.inputbar input{
 flex:1;
 border:2px solid #ddd6fe;
 border-radius:25px;
 padding:12px 15px;
 outline:none;
 background:#faf5ff;
 font-size:14px;
}

.send{
 width:46px;
 height:46px;
 border:0;
 border-radius:50%;
 background:linear-gradient(135deg,#6d28d9,#8b5cf6);
 color:#fff;
 font-size:19px;
 cursor:pointer;
}

/* MESSAGE ACTIONS */

.actions{
 position:fixed;
 z-index:200;
 background:#fff;
 border-radius:18px;
 padding:8px;
 box-shadow:0 15px 45px #0004;
 display:none;
 width:230px;
}

.reactionRow{
 display:flex;
 justify-content:space-around;
 padding:5px;
 border-bottom:1px solid #eee;
 margin-bottom:4px;
}

.reactionRow button{
 border:0;
 background:none;
 font-size:22px;
 cursor:pointer;
 padding:5px;
}

.actionBtn{
 width:100%;
 border:0;
 background:none;
 padding:10px;
 text-align:right;
 border-radius:9px;
 color:#43206d;
 cursor:pointer;
}

.actionBtn:hover{
 background:#f5f3ff;
}

/* PANELS */

.panel{
 position:absolute;
 inset:0;
 background:#faf5ff;
 z-index:100;
 display:none;
 flex-direction:column;
}

.panelhead{
 padding:17px;
 background:linear-gradient(110deg,#6d28d9,#a78bfa);
 color:#fff;
 display:flex;
 align-items:center;
 gap:12px;
}

.close{
 margin-right:auto;
 border:0;
 background:#ffffff25;
 color:#fff;
 border-radius:50%;
 width:36px;
 height:36px;
 cursor:pointer;
}

.panelbody{
 padding:20px;
 overflow:auto;
}

.card{
 background:#fff;
 border:1px solid #ede9fe;
 border-radius:20px;
 padding:17px;
 margin-bottom:12px;
 box-shadow:0 5px 15px #4c1d9510;
}

.counter{
 text-align:center;
 color:#6d28d9;
 padding:25px 15px;
}

.counter .big{
 font-size:27px;
 font-weight:800;
 margin:5px 0;
}

.counter .small{
 color:#8b5cf6;
 font-size:12px;
}

.profile-avatar{
 width:85px;
 height:85px;
 margin:auto;
 border-radius:50%;
 background:linear-gradient(135deg,#7c3aed,#c4b5fd);
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:40px;
}

/* TOAST */

.toast{
 position:absolute;
 bottom:80px;
 left:50%;
 transform:translateX(-50%);
 background:#2e1065;
 color:#fff;
 padding:10px 15px;
 border-radius:15px;
 display:none;
 z-index:300;
 font-size:12px;
 box-shadow:0 8px 25px #0004;
 white-space:nowrap;
}

/* DARK */

.dark{
 --bg:#17121f;
 --card:#211a2b;
 --text:#eee5ff;
 --muted:#b9a8cc;
}

.dark .messages{
 background:#17121f;
}

.dark .other,
.dark .card,
.dark .panel,
.dark .inputbar,
.dark .replyPreview,
.dark .searchbar{
 background:#211a2b;
 color:#eee5ff;
}

.dark .inputbar input,
.dark .searchbar input{
 background:#17121f;
 color:#fff;
 border-color:#49375c;
}

.dark .menu,
.dark .actions{
 background:#211a2b;
}

.dark .menu button,
.dark .actionBtn{
 color:#eee5ff;
}

.dark .actionBtn:hover{
 background:#30243c;
}

.dark .typing{
 background:#17121f;
}

.dark .reactionRow{
 border-color:#49375c;
}

/* SCROLLBAR */

::-webkit-scrollbar{
 width:5px;
}

::-webkit-scrollbar-thumb{
 background:#c4b5fd;
 border-radius:10px;
}
</style>
</head>

<body>

<div class="app" id="app">

<!-- LOGIN -->

<section id="login" class="screen">

<div class="heart">❤️</div>

<div class="login-title">
حسن ♥ نادی
</div>

<div class="login-sub">
اتاق خصوصی دونفره
</div>

<input
 id="pin"
 class="password"
 type="password"
 maxlength="8"
 placeholder="رمز ورود"
>

<button class="user hasan" onclick="login('حسن')">
👤 من حسن هستم
</button>

<button class="user nadi" onclick="login('نادی')">
👤 من نادی هستم
</button>

<small style="color:#a78bfa;margin-top:12px">
❤️ فقط برای ما دوتا
</small>

</section>


<!-- CHAT -->

<section id="chat" class="screen" style="display:none">

<header class="header">

<div class="headrow">

<div class="avatar">
❤️
</div>

<div>
<h2>حسن ♥ نادی</h2>

<div class="status" id="status">
● در حال اتصال...
</div>

</div>

<button class="iconbtn" onclick="toggleMenu()">
☰
</button>

</div>


<div class="menu" id="menu">

<button onclick="toggleSearch()">
🔍 جستجوی پیام
</button>

<button onclick="openPanel('profile')">
👤 پروفایل
</button>

<button onclick="openPanel('love')">
❤️ داستان ما
</button>

<button onclick="openPanel('settings')">
⚙️ تنظیمات
</button>

<button onclick="logout()">
🚪 خروج
</button>

</div>

</header>


<!-- SEARCH -->

<div class="searchbar" id="searchbar">

<input
 id="searchInput"
 placeholder="جستجو در پیام‌ها..."
 oninput="searchMessages()"
>

</div>


<!-- MESSAGES -->

<div id="messages" class="messages"></div>


<!-- TYPING -->

<div id="typing" class="typing"></div>


<!-- REPLY PREVIEW -->

<div id="replyPreview" class="replyPreview">

<button onclick="cancelReply()">✕</button>

<div class="replyPreviewBox">

پاسخ به:
<strong id="replyName"></strong>

<div id="replyText"></div>

</div>

</div>


<!-- INPUT -->

<div class="inputbar">

<input
 id="input"
 placeholder="پیامت رو بنویس..."
 autocomplete="off"
 oninput="handleTyping()"
>

<button class="send" onclick="send()">
➤
</button>

</div>

</section>


<!-- ACTION MENU -->

<div id="actions" class="actions">

<div class="reactionRow">

<button onclick="chooseReaction('❤️')">❤️</button>
<button onclick="chooseReaction('😂')">😂</button>
<button onclick="chooseReaction('😍')">😍</button>
<button onclick="chooseReaction('😢')">😢</button>
<button onclick="chooseReaction('😡')">😡</button>

</div>

<button class="actionBtn" onclick="startReply()">
↩️ پاسخ
</button>

<button class="actionBtn" onclick="copySelected()">
📋 کپی
</button>

<button class="actionBtn" onclick="pinSelected()">
📌 سنجاق / برداشتن سنجاق
</button>

<button class="actionBtn" id="editButton" onclick="editSelected()">
✏️ ویرایش
</button>

<button class="actionBtn" id="deleteButton" onclick="deleteSelected()">
🗑️ حذف
</button>

</div>


<!-- PROFILE -->

<section id="profile" class="panel">

<div class="panelhead">

<b>👤 پروفایل</b>

<button class="close" onclick="closePanels()">
✕
</button>

</div>

<div class="panelbody">

<div class="card" style="text-align:center">

<div class="profile-avatar">
❤️
</div>

<h3 id="profileName" style="margin-top:15px"></h3>

<p style="margin-top:8px;color:#8b5cf6">
این حساب وارد شده است ❤️
</p>

</div>

</div>

</section>


<!-- LOVE -->

<section id="love" class="panel">

<div class="panelhead">

<b>❤️ داستان ما</b>

<button class="close" onclick="closePanels()">
✕
</button>

</div>

<div class="panelbody">

<div class="card counter" id="counter">
در حال محاسبه...
</div>

<div class="card" style="text-align:center">

💌

<h3 style="margin:8px 0">
۲۳ خرداد ۱۴۰۴
</h3>

<p style="color:#8b7aa8;font-size:13px">
روزی که داستان حسن و نادی شروع شد ❤️
</p>

</div>

</div>

</section>


<!-- SETTINGS -->

<section id="settings" class="panel">

<div class="panelhead">

<b>⚙️ تنظیمات</b>

<button class="close" onclick="closePanels()">
✕
</button>

</div>

<div class="panelbody">

<div class="card">

<button class="user nadi" onclick="toggleDark()">
🌙 تغییر حالت شب
</button>

<button class="user hasan" onclick="clearLocal()">
🧹 خروج از این دستگاه
</button>

</div>

</div>

</section>


<div id="toast" class="toast"></div>

</div>


<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>


<script>

/* FIREBASE */

const firebaseConfig={

apiKey:"AIzaSyApRWz3VlVu5vJ-lr6XOvmU7xQ5LHXHajE",

authDomain:"hasan-nadi-chat.firebaseapp.com",

databaseURL:"https://hasan-nadi-chat-default-rtdb.europe-west1.firebasedatabase.app",

projectId:"hasan-nadi-chat",

storageBucket:"hasan-nadi-chat.firebasestorage.app",

messagingSenderId:"447911828704",

appId:"1:447911828704:web:839f082973cc21735c8485",

measurementId:"G-D51K3ZX31"

};

firebase.initializeApp(firebaseConfig);

const db=firebase.database();


let currentUser=null;
let listener=null;
let selectedMessage=null;
let replyTo=null;
let typingTimer=null;


/* LOGIN */

function login(name){

 const pin=
 document.getElementById('pin').value;

 if(
 localStorage.chatPin &&
 pin!==localStorage.chatPin
 ){

  toast('رمز ورود اشتباهه ❌');

  return;
 }

 currentUser=name;

 localStorage.chatUser=name;

 document.getElementById('login')
 .style.display='none';

 document.getElementById('chat')
 .style.display='flex';

 document.getElementById('profileName')
 .textContent='سلام '+name+' 👋';

 load();

 setOnline(true);
}


/* LOAD */

function load(){

 const box=
 document.getElementById('messages');

 if(listener){

  db.ref('messages')
  .off('value',listener);

 }

 listener=s=>{

  box.innerHTML='';

  const data=s.val()||{};

  let arr=
  Object.entries(data)
  .map(([id,v])=>({
   ...v,
   id
  }))
  .sort(
   (a,b)=>
   (a.timestamp||0)-
   (b.timestamp||0)
  );


  const search=
  document
  .getElementById('searchInput')
  .value
  .trim()
  .toLowerCase();


  if(search){

   arr=arr.filter(m=>
    String(m.text||'')
    .toLowerCase()
    .includes(search)
   );

  }


  if(!arr.length){

   box.innerHTML=`

   <div style="
   text-align:center;
   color:#a78bfa;
   margin-top:45px;
   line-height:2;
   ">

   ${search
   ?'🔍<br>پیامی پیدا نشد'
   :'❤️<br>هنوز پیامی نیست...<br>اولین پیام رو بفرست'}

   </div>`;

   return;
  }


  arr.forEach(m=>{

   const el=
   document.createElement('div');

   el.className=
   'msg '+
   (m.name===currentUser
   ?'me'
   :'other');


   /* PIN */

   if(m.pinned){

    const p=
    document.createElement('div');

    p.className='pinned';

    p.textContent='📌';

    el.appendChild(p);

   }


   /* NAME */

   const name=
   document.createElement('div');

   name.className='msgname';

   name.textContent=m.name;

   el.appendChild(name);


   /* REPLY */

   if(m.reply){

    const rb=
    document.createElement('div');

    rb.className='replybox';

    rb.textContent=
    m.reply.name+
    ': '+
    m.reply.text;

    el.appendChild(rb);

   }


   /* BODY */

   const body=
   document.createElement('div');

   body.className='body';

   body.textContent=m.text||'';

   el.appendChild(body);


   /* TIME */

   const timeEl=
   document.createElement('div');

   timeEl.className='msgtime';

   timeEl.textContent=
   time(m.timestamp);

   if(m.edited){

    const ed=
    document.createElement('span');

    ed.className='edited';

    ed.textContent='ویرایش شد';

    timeEl.appendChild(ed);

   }

   el.appendChild(timeEl);


   /* REACTION */

   if(m.reaction){

    const r=
    document.createElement('div');

    r.className='reaction';

    r.textContent=m.reaction;

    el.appendChild(r);

   }


   /* LONG PRESS */

   let pressTimer;

   el.addEventListener(
   'touchstart',
   ()=>{

    pressTimer=setTimeout(
     ()=>openActions(m,el),
     550
    );

   },
   {passive:true});


   el.addEventListener(
   'touchend',
   ()=>clearTimeout(pressTimer)
   );


   el.addEventListener(
   'touchmove',
   ()=>clearTimeout(pressTimer)
   );


   /* DOUBLE CLICK */

   el.addEventListener(
   'dblclick',
   ()=>{
    selectedMessage=m;
    chooseReaction('❤️');
   });


   box.appendChild(el);

  });


  box.scrollTop=box.scrollHeight;

 };


 db.ref('messages')
 .on('value',listener);

}


/* SEND */

function send(){

 const input=
 document.getElementById('input');

 const text=
 input.value.trim();

 if(!text||!currentUser)
  return;


 const data={
  name:currentUser,
  text:text,
  timestamp:Date.now()
 };


 if(replyTo){

  data.reply={
   name:replyTo.name,
   text:replyTo.text
  };

 }


 db.ref('messages')
 .push(data)
 .then(()=>{

  input.value='';

  cancelReply();

  setTyping(false);

 });

}


/* TYPING */

function handleTyping(){

 if(!currentUser)return;

 setTyping(true);

 clearTimeout(typingTimer);

 typingTimer=setTimeout(
  ()=>setTyping(false),
  1500
 );

}


function setTyping(value){

 db.ref(
 'typing/'+currentUser
 ).set(value);

}


function watchTyping(){

 if(!currentUser)return;

 const other=
 currentUser==='حسن'
 ?'نادی'
 :'حسن';

 db.ref(
 'typing/'+other
 ).on(
 'value',
 s=>{

  document.getElementById('typing')
  .textContent=
  s.val()
  ?other+' در حال نوشتن... 💜'
  :'';

 });

}


/* ACTION MENU */

function openActions(m,el){

 selectedMessage=m;

 const actions=
 document.getElementById('actions');

 actions.style.display='block';

 const rect=
 el.getBoundingClientRect();

 let top=
 rect.top-210;

 if(top<10)top=10;

 let left=
 rect.left;

 if(left+230>
 window.innerWidth-10){

  left=
  window.innerWidth-240;

 }

 actions.style.top=top+'px';

 actions.style.left=left+'px';


 const edit=
 document.getElementById('editButton');

 const del=
 document.getElementById('deleteButton');

 if(m.name===currentUser){

  edit.style.display='block';
  del.style.display='block';

 }else{

  edit.style.display='none';
  del.style.display='none';

 }

}


function closeActions(){

 document.getElementById('actions')
 .style.display='none';

}


document.addEventListener(
 'click',
 e=>{

  const actions=
  document.getElementById('actions');

  if(
   actions.style.display==='block' &&
   !actions.contains(e.target)
  ){

   closeActions();

  }

 });


/* REACTION */

function chooseReaction(reaction){

 if(!selectedMessage)return;

 const id=
 selectedMessage.id;

 if(
  selectedMessage.reaction===
  reaction
 ){

  reaction='';

 }

 db.ref(
 'messages/'+id+'/reaction'
 ).set(reaction);

 closeActions();

}


/* REPLY */

function startReply(){

 if(!selectedMessage)return;

 replyTo=selectedMessage;

 document.getElementById('replyName')
 .textContent=selectedMessage.name;

 document.getElementById('replyText')
 .textContent=selectedMessage.text;

 document.getElementById('replyPreview')
 .style.display='block';

 document.getElementById('input')
 .focus();

 closeActions();

}


function cancelReply(){

 replyTo=null;

 document.getElementById('replyPreview')
 .style.display='none';

}


/* COPY */

function copySelected(){

 if(!selectedMessage)return;

 navigator.clipboard
 .writeText(selectedMessage.text||'');

 toast('پیام کپی شد 📋');

 closeActions();

}


/* EDIT */

function editSelected(){

 if(!selectedMessage)return;

 if(selectedMessage.name!==currentUser)
  return;

 const newText=
 prompt(
  'متن جدید پیام:',
  selectedMessage.text
 );

 if(
  newText===null ||
  !newText.trim()
 ){

  closeActions();

  return;
 }

 db.ref(
 'messages/'+selectedMessage.id
 ).update({

  text:newText.trim(),

  edited:true,

  editedAt:Date.now()

 });

 closeActions();

 toast('پیام ویرایش شد ✏️');

}


/* DELETE */

function deleteSelected(){

 if(!selectedMessage)return;

 if(selectedMessage.name!==currentUser)
  return;

 if(
  !confirm('این پیام حذف شود؟')
 ){

  closeActions();

  return;
 }

 db.ref(
 'messages/'+selectedMessage.id
 ).remove();

 closeActions();

 toast('پیام حذف شد 🗑️');

}


/* PIN */

function pinSelected(){

 if(!selectedMessage)return;

 const newValue=
 !selectedMessage.pinned;

 db.ref(
 'messages/'+selectedMessage.id+
 '/pinned'
 ).set(newValue);

 closeActions();

 toast(
  newValue
  ?'پیام سنجاق شد 📌'
  :'سنجاق برداشته شد'
 );

}


/* SEARCH */

function toggleSearch(){

 const bar=
 document.getElementById('searchbar');

 bar.style.display=
 bar.style.display==='block'
 ?'none'
 :'block';

 document.getElementById('menu')
 .style.display='none';

 if(bar.style.display==='block'){

  document
  .getElementById('searchInput')
  .focus();

 }

}


function searchMessages(){

 load();

}


/* ONLINE */

function setOnline(value){

 db.ref(
 'presence/'+currentUser
 ).set({

  online:value,

  lastSeen:
  firebase.database.ServerValue.TIMESTAMP

 });


 db.ref(
 'presence/'+currentUser
 ).onDisconnect()
 .update({

  online:false,

  lastSeen:
  firebase.database.ServerValue.TIMESTAMP

 });


 const other=
 currentUser==='حسن'
 ?'نادی'
 :'حسن';


 db.ref('presence/'+other)
 .on(
 'value',
 s=>{

  const d=s.val()||{};

  const status=
  document.getElementById('status');


  if(d.online){

   status.textContent='● آنلاین';

   status.classList.add('online');

  }else{

   status.textContent='● آفلاین';

   status.classList.remove('online');

  }

 });

 watchTyping();

}


/* ENTER */

document
.getElementById('input')
.addEventListener(
 'keydown',
 e=>{

  if(e.key==='Enter'){

   e.preventDefault();

   send();

  }

 });


/* MENU */

function toggleMenu(){

 const m=
 document.getElementById('menu');

 m.style.display=
 m.style.display==='block'
 ?'none'
 :'block';

}


/* PANELS */

function openPanel(id){

 document.getElementById('menu')
 .style.display='none';

 document.getElementById(id)
 .style.display='flex';

}


function closePanels(){

 document
 .querySelectorAll('.panel')
 .forEach(
  x=>x.style.display='none'
 );

}


/* DARK */

function toggleDark(){

 const app=
 document.getElementById('app');

 app.classList.toggle('dark');

 localStorage.dark=
 app.classList.contains('dark');

}


/* LOGOUT */

function logout(){

 if(currentUser){

  setOnline(false);

  setTyping(false);

 }

 currentUser=null;

 localStorage.removeItem('chatUser');

 location.reload();

}


/* CLEAR */

function clearLocal(){

 localStorage.clear();

 location.reload();

}


/* TOAST */

function toast(text){

 const x=
 document.getElementById('toast');

 x.textContent=text;

 x.style.display='block';

 setTimeout(
  ()=>x.style.display='none',
  1800
 );

}


/* RELATIONSHIP COUNTER */

/*
 شروع رابطه:
 ۲۳ خرداد ۱۴۰۴
 = ۱۳ ژوئن ۲۰۲۵

 اگر ساعت دقیق شروع را می‌دانی،
 می‌توانیم بعداً ساعت را هم تنظیم کنیم.
*/

const start=
new Date('2025-06-13T00:00:00');


function counter(){

 const ms=
 Math.max(
  0,
  Date.now()-start
 );

 const days=
 Math.floor(ms/86400000);

 const hours=
 Math.floor(
  (ms%86400000)/3600000
 );

 const minutes=
 Math.floor(
  (ms%3600000)/60000
 );

 const seconds=
 Math.floor(
  (ms%60000)/1000
 );


 document.getElementById('counter')
 .innerHTML=`

 ❤️

 <div class="big">
 ${days} روز
 </div>

 <div>
 ${hours} ساعت
 ${minutes} دقیقه
 ${seconds} ثانیه
 </div>

 <div class="small">
 از ۲۳ خرداد ۱۴۰۴ تا امروز ❤️
 </div>

 `;

}


counter();

setInterval(counter,1000);


/* DARK LOAD */

if(localStorage.dark==='true'){

 document
 .getElementById('app')
 .classList.add('dark');

}


/* AUTO LOGIN */

if(localStorage.chatUser){

 currentUser=
 localStorage.chatUser;

 document.getElementById('login')
 .style.display='none';

 document.getElementById('chat')
 .style.display='flex';

 document.getElementById('profileName')
 .textContent=
 'سلام '+currentUser+' 👋';

 load();

 setOnline(true);

}

</script>
